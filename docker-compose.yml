services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: issuance
      POSTGRES_USER: issuance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [issuance-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuance -d issuance"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgresql://issuance:${POSTGRES_PASSWORD}@db:5432/issuance
      FRONTEND_ORIGIN: http://localhost:3000
      PORT: 4000
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]
  frontend:
    build: .
    environment:
      API_URL: http://backend:4000
      DATABASE_URL: postgresql://issuance:${POSTGRES_PASSWORD}@db:5432/issuance
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  issuance-db:
